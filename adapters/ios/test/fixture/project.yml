name: Fixture
options:
  bundleIdPrefix: example.rrfixture
  deploymentTarget:
    iOS: "17.0"
targets:
  Fixture:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: ShareExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.rrfixture.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  ShareExt:
    type: app-extension
    platform: iOS
    sources: [ShareExt]
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.rrfixture.app.share
        CODE_SIGNING_ALLOWED: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
