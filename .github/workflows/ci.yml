name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests parse
        run: node -e "for (const f of ['plugin','marketplace']) JSON.parse(require('fs').readFileSync('.claude-plugin/'+f+'.json','utf8'))"
      - name: Skill and workflow exist
        run: node -e "for (const f of ['skills/rebuild-review/SKILL.md','workflows/rebuild-review.js']) require('fs').accessSync(f)"
      - name: Script tests
        run: |
          (cd adapters/web && pnpm install --frozen-lockfile)
          node --test scripts/visual-diff.test.mjs
          node --test scripts/check-features.test.mjs
          node --test scripts/parity-results.test.mjs
          node --test scripts/room.test.mjs
          node --test scripts/sandbox-deps.test.mjs
          node --test scripts/free-port.test.mjs
          node --test scripts/score.test.mjs
          node --test scripts/confidence.test.mjs
          node --test scripts/report.test.mjs
          node --test scripts/size.test.mjs
          node --test scripts/agent-cost.test.mjs
          node --test scripts/tag-version.test.mjs
          node --test scripts/base.test.mjs
          node --test scripts/foundations.test.mjs
          node --test scripts/workflow-parse.test.mjs
          node --test scripts/areas.test.mjs
          node --test scripts/long-run.test.mjs
          node --test scripts/events.test.mjs
          node --test scripts/watch.test.mjs
          node --test scripts/rerun.test.mjs
          node --test benchmark/calibrate.test.mjs
          node --test adapters/web/test/crawl.test.mjs adapters/web/test/widths.test.mjs
          node --test adapters/web/test/libs.test.mjs adapters/web/test/browser.test.mjs
          node --test adapters/ios/test/sim.test.mjs

  web-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: adapters/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Context tests (URLs that do not parse, locate waits)
        working-directory: adapters/web
        run: node --test test/auth.test.mjs test/context.test.mjs test/layout-shift.test.mjs test/left-origin.test.mjs test/safe-area.test.mjs
      - name: Adapter tests
        working-directory: adapters/web
        run: pnpm test
      - name: Checker control (every planted item reads present on the original)
        run: |
          T=$(mktemp -d)
          node benchmark/init-history.mjs "$T/target" > /dev/null
          mkdir -p "$T/run"
          git clone -q "$T/target" "$T/run/work"
          echo '{"platform":"web","dir":"app","install":"npm install --no-audit --no-fund","build":"npm run build","start":"node server.mjs","address":"http://127.0.0.1:4471"}' > "$T/run/run.json"
          node benchmark/score-rebuild.mjs "$T/run" --control

  cli-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Adapter tests (eight checks, no display)
        working-directory: adapters/cli
        run: pnpm test

  backend-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Adapter tests (thirty-one checks, no display)
        working-directory: adapters/backend
        run: pnpm test

  library-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Adapter tests (fifteen checks, no display)
        working-directory: adapters/library
        run: pnpm test

  electron-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd adapters/web && pnpm install --frozen-lockfile)
          (cd adapters/electron && pnpm install --frozen-lockfile)
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libxss1 libxtst6
      - name: Adapter tests (fourteen checks, under a virtual display)
        working-directory: adapters/electron
        run: xvfb-run -a pnpm test

  # The hosted macOS runner cannot start Maestro's driver on a simulator (run 43535632516: "Maestro could not start its driver", 0 screens, then the 45 minute limit). This job runs the checks that need no simulator; the simulator run is the manual job below.
  ios-adapter:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Adapter unit tests (no simulator)
        run: node --test adapters/ios/test/sim.test.mjs

  # Manual only (Actions, Run workflow): the numbered simulator checks on a hosted macOS runner.
  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          (cd adapters/web && pnpm install --frozen-lockfile)
          curl -fsSL -o maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  maestro.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/.maestro-rr" && unzip -q maestro.zip -d "$HOME/.maestro-rr"
      - name: Adapter tests (simulator, no window)
        working-directory: adapters/ios
        run: pnpm test
