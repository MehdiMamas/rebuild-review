name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests parse
        run: node -e "for (const f of ['plugin','marketplace']) JSON.parse(require('fs').readFileSync('.claude-plugin/'+f+'.json','utf8'))"
      - name: Skill and workflow exist
        run: node -e "for (const f of ['skills/rebuild-review/SKILL.md','workflows/rebuild-review.js']) require('fs').accessSync(f)"
      - name: Script tests
        run: |
          (cd adapters/web && npm install --no-audit --no-fund)
          node --test scripts/visual-diff.test.mjs
          node --test scripts/check-features.test.mjs
          node --test scripts/parity-results.test.mjs
          node --test scripts/room.test.mjs
          node --test scripts/free-port.test.mjs
          node --test scripts/score.test.mjs
          node --test scripts/confidence.test.mjs
          node --test scripts/report.test.mjs
          node --test scripts/size.test.mjs
          node --test scripts/workflow-parse.test.mjs

  web-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: adapters/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Adapter tests
        working-directory: adapters/web
        run: npm test
      - name: Checker control (every planted item reads present on the original)
        run: |
          T=$(mktemp -d)
          node benchmark/init-history.mjs "$T/target" > /dev/null
          mkdir -p "$T/run"
          git clone -q "$T/target" "$T/run/work"
          echo '{"platform":"web","dir":"app","install":"npm install --no-audit --no-fund","build":"npm run build","start":"node server.mjs","address":"http://127.0.0.1:4471"}' > "$T/run/run.json"
          node benchmark/score-rebuild.mjs "$T/run" --control

  electron-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd adapters/web && npm install --no-audit --no-fund)
          (cd adapters/electron && npm install --no-audit --no-fund)
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libxss1 libxtst6
      - name: Adapter tests (nine checks, under a virtual display)
        working-directory: adapters/electron
        run: xvfb-run -a npm test
